<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>潘鑫 Pan Xin</title>
    <style>
        :root {
            --bg: #fafafa;
            --card: #ffffff;
            --text: #1a1a2e;
            --text-light: #6b7280;
            --accent: #2563eb;
            --border: #e5e7eb;
        }
        @media (prefers-color-scheme: dark) {
            :root {
                --bg: #0f172a;
                --card: #1e293b;
                --text: #e2e8f0;
                --text-light: #94a3b8;
                --accent: #60a5fa;
                --border: #334155;
            }
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Noto Sans SC', sans-serif;
            background: var(--bg);
            color: var(--text);
            line-height: 1.6;
        }
        .container { max-width: 600px; margin: 0 auto; padding: 0 1.5rem; }

        header {
            padding: 4rem 0 1.5rem;
            text-align: center;
        }
        header h1 { font-size: 1.8rem; font-weight: 700; }
        header .sub { color: var(--text-light); margin-top: 0.3rem; font-size: 0.95rem; }

        .section { margin-bottom: 2rem; }

        .links {
            display: flex;
            gap: 1rem;
            justify-content: center;
            flex-wrap: wrap;
        }
        .links a {
            display: inline-flex;
            align-items: center;
            gap: 0.4rem;
            padding: 0.5rem 1.2rem;
            border: 1px solid var(--border);
            border-radius: 8px;
            text-decoration: none;
            color: var(--text);
            font-size: 0.9rem;
            transition: all 0.2s;
            background: var(--card);
        }
        .links a:hover {
            border-color: var(--accent);
            color: var(--accent);
        }

        .desc {
            text-align: center;
            color: var(--text-light);
            font-size: 0.9rem;
            margin: 1.5rem 0;
        }

        footer {
            text-align: center;
            padding: 2rem 0;
            color: var(--text-light);
            font-size: 0.8rem;
        }
    </style>
</head>
